name: Validate Docker deployment

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate scripts
        run: |
          bash -n docker-entrypoint.sh
          bash -n scripts/compose.sh
          node --check scripts/create-config.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("deployment.example.json", "utf8"))'

      - name: Validate generated base-path configuration
        run: |
          config_file="$(mktemp)"
          rm -f "$config_file"
          trap 'rm -f "$config_file"' EXIT
          TEXLITE_DOCKER_ENGINES="pdflatex,xelatex" \
          TEXLITE_BASE_PATH="/tools/texlite/" \
          node scripts/create-config.mjs "$config_file"
          node -e 'const config = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (config.server.basePath !== "/tools/texlite") process.exit(1)' "$config_file"

      - name: Validate Compose through the launcher
        run: |
          temporary_root="$(mktemp -d)"
          trap 'rm -rf "$temporary_root"' EXIT
          cp deployment.example.json deployment.json
          TEMPORARY_ROOT="$temporary_root" node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("deployment.json", "utf8")); config.basePath = "/tools/texlite"; config.configDir = `${process.env.TEMPORARY_ROOT}/config`; config.dataDir = `${process.env.TEMPORARY_ROOT}/data`; fs.writeFileSync("deployment.json", `${JSON.stringify(config, null, 2)}\n`);'
          ./scripts/compose.sh config -q
          node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("deployment.json", "utf8")); delete config.basePath; fs.writeFileSync("deployment.json", `${JSON.stringify(config, null, 2)}\n`);'
          ./scripts/compose.sh config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Dockerfile
        run: docker build --check --file Dockerfile .

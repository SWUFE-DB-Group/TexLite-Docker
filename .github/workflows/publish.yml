name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: docker-hub-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub release settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing GitHub Actions secret DOCKERHUB_TOKEN." >&2; exit 1; }

      - name: Validate release tag
        run: |
          release_tag="${GITHUB_REF_NAME#v}"
          [[ "$release_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v0.1.0)." >&2
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: zhongpu
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: zhongpu/texlite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Report published tags
        run: |
          {
            echo "## Docker Hub image published"
            echo
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build-push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
